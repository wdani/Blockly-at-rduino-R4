name: Build Android APK

on:
  push:
    branches:
      - android/blockly-modern-poc
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare stable alpha signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app/signing
          BASE='https://android.googlesource.com/platform/build/+/refs/tags/android-14.0.0_r1/target/product/security'
          curl -fsSL "$BASE/testkey.pk8?format=TEXT" | base64 --decode > /tmp/aosp-testkey.pk8
          curl -fsSL "$BASE/testkey.x509.pem?format=TEXT" | base64 --decode > /tmp/aosp-testkey.x509.pem
          openssl pkcs8 -inform DER -nocrypt -in /tmp/aosp-testkey.pk8 -out /tmp/aosp-testkey.pem
          openssl pkcs12 -export \
            -in /tmp/aosp-testkey.x509.pem \
            -inkey /tmp/aosp-testkey.pem \
            -out android-app/signing/alpha-testkey.p12 \
            -name elektoAlpha \
            -passout pass:android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Blockly 13.3.0 assets
        run: |
          npm install --prefix android-app/blockly-package --no-save --ignore-scripts blockly@13.3.0
          mkdir -p android-app/app/src/main/assets/blockly/vendor/msg
          cp android-app/blockly-package/node_modules/blockly/blockly_compressed.js android-app/app/src/main/assets/blockly/vendor/
          cp android-app/blockly-package/node_modules/blockly/blocks_compressed.js android-app/app/src/main/assets/blockly/vendor/
          cp android-app/blockly-package/node_modules/blockly/msg/de.js android-app/app/src/main/assets/blockly/vendor/msg/

      - name: Build Blockly POC APK
        run: gradle -p android-app :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elekto-Blocks-Hybrid-12
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
