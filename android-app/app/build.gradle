plugins {
    id 'com.android.application'
}

def alphaKeystore = rootProject.file('signing/alpha-testkey.p12')

android {
    namespace 'ch.elekto.blocklyrduino.r4'
    compileSdk 35

    signingConfigs {
        alphaTest {
            storeFile alphaKeystore
            storePassword 'android'
            keyAlias 'elektoAlpha'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        // Keep alpha/test builds isolated from a future production package.
        // Starting with alpha.4 this ID remains stable so later APKs can update in place.
        applicationId 'ch.elekto.blocklyrduino.r4.alpha'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.1.0-alpha.4'
    }

    buildTypes {
        debug {
            // GitHub Actions creates this PKCS12 file before Gradle starts.
            // Local builds without it fall back to the normal Android debug signing key.
            if (alphaKeystore.exists()) {
                signingConfig signingConfigs.alphaTest
            }
        }
    }
}

def generatedBlocklyAssets = layout.buildDirectory.dir('generated/blocklyAssets')

tasks.register('copyBlocklyAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        exclude '.git/**'
        exclude '.github/**'
        exclude 'android-app/**'
        exclude 'desktop/**'
        exclude 'node_modules/**'
        exclude 'dist/**'
        exclude 'release/**'
        exclude '*.zip'
    }
    into(generatedBlocklyAssets.map { new File(it.asFile, 'www') })
}

android.sourceSets.main.assets.srcDir(generatedBlocklyAssets)
preBuild.dependsOn(copyBlocklyAssets)

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
