plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def alphaKeystore = rootProject.file('signing/alpha-testkey.p12')

android {
    namespace 'ch.elekto.blocklyrduino.r4'
    compileSdk 35

    signingConfigs {
        alphaTest {
            storeFile alphaKeystore
            storePassword 'android'
            keyAlias 'elektoAlpha'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId 'ch.elekto.blocklyrduino.r4.blocklypoc'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.5.0-hybrid.3'
    }

    buildTypes {
        debug {
            if (alphaKeystore.exists()) {
                signingConfig signingConfigs.alphaTest
            }
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
