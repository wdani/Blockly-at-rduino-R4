<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Elekto Blockly POC</title>
  <link rel="stylesheet" href="/assets/blockly/styles.css" />
</head>
<body>
  <div id="workspace"></div>
  <script>
    (function () {
      function load(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = () => reject(new Error('Konnte nicht laden: ' + src));
          document.head.appendChild(script);
        });
      }
      (async () => {
        try {
          await load('/assets/blockly/vendor/blockly_compressed.js');
          await load('/assets/blockly/vendor/blocks_compressed.js');
          await load('/assets/blockly/vendor/msg/de.js');
          await load('/assets/blockly/elekto.js');
          await load('/assets/blockly/preview-fix.js');
        } catch (e) {
          const box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#fff0f0;color:#8b1d1d;border:2px solid #e57373;border-radius:12px;padding:12px;font:14px system-ui;white-space:pre-wrap';
          box.textContent = 'Startfehler: ' + (e?.message || String(e));
          document.body.appendChild(box);
        }
      })();
    })();
  </script>
</body>
</html>
